<!-- Green PWA | Log In -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Green" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Green – Log In</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages/auth.css" />
</head>
<body>

  <div class="page auth-page">

    <div class="auth-header">
      <div class="auth-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--green-700)" stroke-width="1.5">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
          <line x1="4" y1="22" x2="4" y2="15"/>
        </svg>
      </div>
      <h1 class="auth-logo">Green</h1>
      <p class="auth-tagline">Welcome back</p>
    </div>

    <main class="auth-main">

      <div class="auth-form">

        <div class="auth-field">
          <label class="auth-label" for="input-email">Email</label>
          <input class="auth-input" id="input-email" type="email" placeholder="james@example.com" maxlength="254" autocomplete="email" autocorrect="off" autocapitalize="none" />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="input-password">Password</label>
          <input class="auth-input" id="input-password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <span class="auth-error" id="login-error"></span>

        <button class="auth-submit" id="login-btn">Log in</button>

      </div>

      <div class="auth-divider">
        <div class="auth-divider-line"></div>
        <span class="auth-divider-text">no account yet?</span>
        <div class="auth-divider-line"></div>
      </div>

      <div class="auth-switch">
        <a href="create-account.html">Create account</a>
      </div>

      <div class="auth-skip">
        <a href="index.html" onclick="localStorage.setItem('green_skip_auth','1')">Continue without an account</a>
      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/db.js"></script>
  <script>
    (function () {

      const emailEl  = document.getElementById('input-email');
      const passwordEl = document.getElementById('input-password');
      const loginErr  = document.getElementById('login-error');
      const loginBtn  = document.getElementById('login-btn');

      loginBtn.addEventListener('click', async () => {
        const email    = emailEl.value.trim();
        const password = passwordEl.value;

        loginErr.textContent = '';

        if (!email) { loginErr.textContent = 'Email is required'; return; }
        if (!password) { loginErr.textContent = 'Password is required'; return; }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in…';

        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          loginErr.textContent = error.message;
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log in';
          return;
        }

        window.location.href = 'index.html';
      });

      // Allow Enter key
      emailEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') loginBtn.click();
      });
      passwordEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') loginBtn.click();
      });

    })();
  </script>

</body>
</html>
