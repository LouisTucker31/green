<!-- Green PWA | User Profile -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Green" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Green – Profile</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages/profile.css" />
</head>
<body>

  <div class="page" id="page-profile">

    <!-- HEADER -->
    <header class="profile-header">
      <h1 class="page-title">Profile</h1>
      <div class="header-actions">
        <a href="settings.html" class="icon-btn" aria-label="Settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </a>
      </div>
    </header>

    <!-- SCROLLABLE CONTENT -->
    <main class="profile-main">

      <!-- IDENTITY -->
      <section class="profile-identity">
        <div class="profile-avatar" id="avatar-wrap">
          <div class="avatar-placeholder" id="avatar-placeholder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <img class="avatar-img hidden" id="avatar-img" alt="Profile photo" />
          <div class="avatar-camera-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <input type="file" id="avatar-input" accept="image/*" class="hidden" />
        </div>
        <div class="profile-identity-info">
          <h2 class="profile-name" id="profile-name">Your Name</h2>
          <span class="profile-handle" id="profile-handle"></span>
          <span class="profile-handicap" id="profile-handicap-display"></span>
        </div>
        <button class="profile-edit-btn" id="edit-profile-btn">Edit Profile</button>
      </section>

      <!-- STATS STRIP -->
      <section class="profile-stats-strip">
        <div class="profile-stat-item">
          <span class="profile-stat-num" id="stat-courses">0</span>
          <span class="profile-stat-lbl">Courses</span>
        </div>
        <div class="profile-stat-divider"></div>
        <div class="profile-stat-item">
          <span class="profile-stat-num" id="stat-posts">0</span>
          <span class="profile-stat-lbl">Posts</span>
        </div>
        <div class="profile-stat-divider"></div>
        <div class="profile-stat-item" id="stat-following-item" style="cursor:pointer;">
          <span class="profile-stat-num" id="stat-following">0</span>
          <span class="profile-stat-lbl">Following</span>
        </div>
      </section>

      <!-- TAB BAR -->
      <div class="profile-tabs">
        <button class="profile-tab active" data-tab="posts">Posts</button>
        <button class="profile-tab" data-tab="info">Info</button>
      </div>

      <!-- POSTS GRID -->
      <div class="profile-posts-grid" id="profile-posts-grid"></div>
      <div class="profile-posts-empty hidden" id="profile-posts-empty">
        <p class="profile-empty-text">No posts yet</p>
        <p class="profile-empty-sub">Share a round from your feed</p>
      </div>

      <!-- INFO PANEL -->
      <div class="profile-info-panel hidden" id="profile-info-panel">
        <section class="profile-details">
          <div class="profile-detail-row">
            <span class="detail-label">Home Course</span>
            <span class="detail-value" id="detail-home-course">—</span>
          </div>
          <div class="profile-detail-row">
            <span class="detail-label">Handicap</span>
            <span class="detail-value" id="detail-handicap">—</span>
          </div>
          <div class="profile-detail-row">
            <span class="detail-label">Best Score</span>
            <span class="detail-value" id="detail-best-score">—</span>
          </div>
        </section>
        <a href="achievements.html" class="achievements-link">
          <span>Achievements</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </a>
      </div>

    </main>

    <!-- EDIT MODAL -->
    <div class="sheet-overlay hidden" id="edit-modal-overlay"></div>
    <div class="bottom-sheet hidden" id="edit-modal">
      <div class="sheet-handle"></div>
      <div class="sheet-body">
        <h2 class="modal-title">Edit Profile</h2>
        <div class="form-group">
          <label class="form-label">Name</label>
          <input class="form-input" id="input-name" type="text" placeholder="Your name" />
        </div>
        <div class="form-group">
          <label class="form-label">Handle</label>
          <input class="form-input" id="input-handle" type="text" placeholder="yourhandle" />
          <span class="handle-error" id="handle-error"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Home Course</label>
          <input class="form-input" id="input-home-course" type="text" placeholder="Search courses..." autocomplete="off" />
          <div class="course-search-results hidden" id="home-course-results"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Handicap</label>
          <input class="form-input" id="input-handicap" type="number" step="0.1" placeholder="e.g. 8.3" />
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="edit-cancel-btn">Cancel</button>
          <button class="btn-primary" id="edit-save-btn">Save</button>
        </div>
      </div>
    </div>

    <!-- FOLLOWING SHEET -->
  <div class="sheet-overlay hidden" id="following-overlay"></div>
  <div class="bottom-sheet hidden" id="following-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 class="sheet-title">Following</h2>
      <button class="sheet-close" id="following-close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="following-list" id="following-list"></div>
  </div>

    <!-- AVATAR ACTION SHEET -->
    <div class="sheet-overlay hidden" id="avatar-overlay"></div>
    <div class="avatar-action-sheet hidden" id="avatar-sheet">
      <div class="sheet-handle"></div>
      <button class="avatar-action-btn" id="avatar-change-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Change photo
      </button>
      <div class="avatar-action-divider"></div>
      <button class="avatar-action-btn danger" id="avatar-remove-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
        Remove photo
      </button>
    </div>

    <!-- CROP OVERLAY -->
    <div class="crop-overlay hidden" id="crop-overlay">
      <div class="crop-header">
        <button class="crop-cancel-btn" id="crop-cancel-btn">Cancel</button>
        <h2 class="crop-title">Move and Scale</h2>
        <button class="crop-use-btn" id="crop-use-btn">Use Photo</button>
      </div>
      <div class="crop-stage" id="crop-stage">
        <canvas id="crop-canvas"></canvas>
        <div class="crop-frame"></div>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="courses.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Courses</span>
      </a>
      <a href="feed.html" class="nav-item nav-add">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
          <line x1="4" y1="22" x2="4" y2="15"/>
        </svg>
      </a>
      <a href="passport.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M8 7h8M8 12h8M8 17h5"/>
        </svg>
        <span>Passport</span>
      </a>
      <a href="profile.html" class="nav-item active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>

  </div>

  <script src="js/data/courses-data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/components/sheets.js"></script>
  <script src="js/components/nav.js"></script>
  <script src="js/pages/profile.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
