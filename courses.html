<!-- Green PWA | Course Browser -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Green" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Green – Courses</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages/courses.css" />
</head>
<body>

  <div class="page" id="page-courses">

    <!-- HEADER -->
    <header class="courses-header">
      <h1 class="page-title">Courses</h1>
    </header>

    <!-- SEARCH -->
    <div class="search-bar-wrap">
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" placeholder="Search for a course" class="search-input" id="search-input" />
        <button class="search-clear hidden" id="search-clear" aria-label="Clear">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- FILTER TABS -->
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="played">Played</button>
      <button class="filter-tab" data-filter="wishlist">Wishlist</button>
      <button class="filter-tab" data-filter="favourite">Favourite</button>
    </div>

    <!-- SCROLLABLE CONTENT -->
    <main class="courses-main" id="courses-main">

      <!-- LOADING STATE -->
      <div class="loading-state" id="loading-state">
        <div class="loading-spinner"></div>
        <span id="loading-message">Loading courses...</span>
      </div>

      <!-- ERROR STATE -->
      <div class="error-state hidden" id="error-state">
        <span>Failed to load courses. Please try again.</span>
        <button class="retry-btn" id="retry-btn">Retry</button>
      </div>

      <!-- NEARBY COURSES -->
      <section class="courses-section hidden" id="nearby-section">
        <div class="section-header">
          <h2 class="section-title">Nearby Courses</h2>
        </div>
        <div class="course-list" id="nearby-list"></div>
      </section>

      <!-- ALL / FILTERED COURSES -->
      <section class="courses-section hidden" id="all-section">
        <div class="section-header">
          <h2 class="section-title" id="all-section-title">All Courses</h2>
          <span class="course-count" id="course-count"></span>
        </div>
        <div id="alpha-groups"></div>
      </section>

      <!-- LOAD MORE -->
      <div class="load-more-wrap hidden" id="load-more-wrap">
        <button class="load-more-btn" id="load-more-btn">Load more courses</button>
      </div>

      <!-- EMPTY STATE -->
      <div class="empty-state hidden" id="empty-state">
        <span id="empty-message">No courses found</span>
      </div>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="courses.html" class="nav-item active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Courses</span>
      </a>
      <a href="feed.html" class="nav-item nav-add">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
          <line x1="4" y1="22" x2="4" y2="15"/>
        </svg>
      </a>
      <a href="passport.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M8 7h8M8 12h8M8 17h5"/>
        </svg>
        <span>Passport</span>
      </a>
      <a href="profile.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data/courses-data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components/sheet.js"></script>
  <script src="js/components/nav.js"></script>
  <script src="js/components/map.js"></script>
  <script src="js/pages/courses.js"></script>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
