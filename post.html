<!-- Green PWA | Post / Round detail -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Green" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Green – Round</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages/post.css" />
</head>
<body>

  <div class="page" id="page-post">

    <!-- HERO IMAGE (full width, back button overlaid) -->
    <div class="post-hero" id="post-hero">
      <div class="post-hero-placeholder" id="post-hero-placeholder"></div>
      <div class="post-hero-thumbs hidden" id="post-hero-thumbs"></div>
      <a href="#" onclick="history.back(); return false;" class="post-back-btn" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
    </div>

    <!-- SCROLLABLE CONTENT -->
    <main class="post-main" id="post-main">

      <!-- NOT FOUND -->
      <div class="post-not-found hidden" id="post-not-found">
        <p>Round not found</p>
        <a href="feed.html" class="btn-primary" style="margin-top:16px;">Back to feed</a>
      </div>

      <div id="post-content" class="hidden">

        <!-- USER ROW -->
        <div class="post-user-row">
          <div class="post-avatar" id="post-avatar"></div>
          <div class="post-author">
            <span class="post-author-name" id="post-author-name"></span>
            <span class="post-author-handle" id="post-author-handle"></span>
          </div>
          <span class="post-date" id="post-date"></span>
      <button class="post-more-btn" id="post-more-btn" aria-label="More options">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
        </svg>
      </button>
    </div>

        <!-- COURSE CARD -->
        <a class="post-course-card" id="post-course-link" href="#">
          <div class="post-course-info">
            <span class="post-course-name" id="post-course-name"></span>
            <span class="post-course-location" id="post-course-location"></span>
            <div class="post-course-meta" id="post-course-meta"></div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--grey-400)" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </a>

        <!-- SCORE rendered inside course card by JS -->

        <!-- PHOTOS handled in hero -->

        <!-- CAPTION -->
        <p class="post-caption hidden" id="post-caption"></p>

        <!-- ACTIONS -->
        <div class="post-actions">
          <button class="post-action-btn post-like-btn" id="post-like-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span id="post-like-label">Like</span>
          </button>
          <button class="post-action-btn" id="post-comment-action-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span>Comment</span>
          </button>
          <button class="post-action-btn" id="post-share-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            <span>Share</span>
          </button>
        </div>

        <!-- LIKES COUNT -->
        <p class="post-likes-count hidden" id="post-likes-count"></p>

        <!-- EDIT / DELETE handled via three-dot sheet -->

        <!-- COMMENTS -->
        <section class="post-comments-section">
          <h2 class="post-comments-title">Comments</h2>
          <div class="post-comments-list" id="post-comments-list">
            <p class="post-comments-empty" id="post-comments-empty">No comments yet. Be the first.</p>
          </div>
        </section>

      </div>
    </main>

    <!-- MORE OPTIONS SHEET -->
  <div class="sheet-overlay hidden" id="more-overlay"></div>
  <div class="bottom-sheet hidden" id="more-sheet">
    <div class="sheet-handle"></div>
    <div class="more-sheet-options">
      <button class="more-sheet-btn" id="post-edit-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Edit post
      </button>
      <button class="more-sheet-btn more-sheet-btn--delete" id="post-delete-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
        Delete post
      </button>
    </div>
  </div>

  <!-- FULLSCREEN GALLERY -->
  <div class="gallery-overlay hidden" id="gallery-overlay">
    <button class="gallery-close" id="gallery-close" aria-label="Close gallery">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="gallery-track" id="gallery-track"></div>
    <div class="gallery-dots" id="gallery-dots"></div>
  </div>

  <!-- edit handled by compose screen injected by post.js -->

  <!-- COMMENT INPUT (fixed bottom) -->
    <div class="post-comment-bar hidden" id="post-comment-bar">
      <div class="post-comment-avatar" id="post-comment-avatar"></div>
      <input type="text" class="post-comment-input" id="post-comment-input" placeholder="Add a comment…" />
      <button class="post-comment-send" id="post-comment-send" aria-label="Send comment">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data/courses-data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components/sheets.js"></script>
  <script src="js/pages/post.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
