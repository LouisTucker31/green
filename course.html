<!-- Green PWA | Course Detail -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Green" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Green – Course</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages/course.css" />
</head>
<body>

  <div class="page" id="page-course">

    <!-- HEADER -->
    <header class="course-detail-header">
      <a href="#" onclick="history.back(); return false;" class="back-btn" id="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
      <div class="header-actions">
        <button class="icon-btn" id="share-btn" aria-label="Share">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- SCROLLABLE CONTENT -->
    <main class="course-detail-main">

      <!-- NOT FOUND STATE -->
      <div class="course-not-found hidden" id="course-not-found">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>Course not found</p>
        <a href="courses.html" class="btn-primary">Back to courses</a>
      </div>

      <!-- COURSE CONTENT -->
      <div id="course-content">

        <!-- HERO -->
        <div class="course-hero">
          <div class="course-hero-img" id="course-hero-img"></div>
          <div class="course-hero-info">
            <h1 class="course-hero-name" id="course-name">—</h1>
            <p class="course-hero-location" id="course-location">—</p>
          </div>
        </div>

        <!-- BADGES ROW -->
        <div class="course-badges" id="course-badges"></div>

        <!-- ACTION BUTTONS -->
        <div class="course-actions">
          <button class="action-btn" id="btn-played" data-active="false">
            <span class="action-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </span>
            <span class="action-label">Played</span>
          </button>
          <button class="action-btn" id="btn-wishlist" data-active="false">
            <span class="action-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </span>
            <span class="action-label">Wishlist</span>
          </button>
          <button class="action-btn" id="btn-favourite" data-active="false">
            <span class="action-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
            </span>
            <span class="action-label">Favourite</span>
          </button>
        </div>

        <!-- LOG ROUND BUTTON -->
        <button class="log-round-btn" id="log-round-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Log a Round
        </button>

        <!-- COURSE INFO CARD -->
        <div class="info-card" id="course-info-card"></div>

        <!-- ROUNDS HISTORY -->
        <section class="rounds-section">
          <div class="section-header">
            <h2 class="section-title">Rounds Here</h2>
            <span class="round-count" id="round-count"></span>
          </div>
          <div id="rounds-list">
            <div class="rounds-empty hidden" id="rounds-empty">
              <p>No rounds logged yet</p>
            </div>
          </div>
        </section>

      </div>

    </main>

  </div>

  <!-- LOG ROUND SHEET -->
  <div class="sheet-overlay hidden" id="sheet-overlay"></div>
  <div class="bottom-sheet hidden" id="log-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheet-title">Log a Round</h2>
      <button class="sheet-close" id="sheet-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="form-field">
        <label class="form-label">Date</label>
        <input type="date" class="form-input" id="input-date" required />
      </div>
      <div class="form-field">
        <label class="form-label">Score <span class="form-optional">(optional)</span></label>
        <input type="number" class="form-input" id="input-score" placeholder="e.g. 82" min="18" max="200" inputmode="numeric" pattern="[0-9]*" />
      </div>
      <div class="form-field">
        <label class="form-label">Notes <span class="form-optional">(optional)</span></label>
        <textarea class="form-input form-textarea" id="input-notes" placeholder="How did it go?" maxlength="500"></textarea>
      </div>
      <button class="btn-primary" id="save-round-btn">Save Round</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data/courses-data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components/sheets.js"></script>
  <script src="js/components/map.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/pages/course.js"></script>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
